name: 发布评论治理工作台
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
      - name: 运行网页与规则检查
        run: node --test tests/engine.test.cjs tests/app-logic.test.cjs
      - name: 运行适配器无模型检查
        run: python3 -m unittest discover -s engine -p 'test_*.py'
      - name: 配置网页发布
        uses: actions/configure-pages@v5
      - name: 上传静态网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
